# Build the arm64 image the CLOUD9 VM pulls (ghcr.io/silversoul-07/zola:main).
# Native ARM runner, so no QEMU. Same pattern as cloud9's build.yml.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/silversoul-07/zola:main
            ghcr.io/silversoul-07/zola:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
